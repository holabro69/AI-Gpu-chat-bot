<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GPU Data Chat Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Orbitron', 'Inter', 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #00ffee; margin: 0; min-height: 100vh; transition: background 0.22s, color 0.22s; }
    #vanta-bg { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: -2; pointer-events: none; }
    .container { max-width: 600px; margin: 32px auto; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 1.5em; box-shadow: 0 0 15px #0ff; display: flex; flex-direction: column; min-height: 80vh; position: relative; overflow: hidden; z-index: 1; }
    h2 { text-align: center; font-weight: 700; font-size: 1.8em; letter-spacing: 0.05em; padding: 0.5em 0; color: #0ff; text-shadow: 0 0 12px #0ff, 0 0 22px #0ff, 0 0 30px #fff; }
    #chatbox { flex: 1; overflow-y: auto; padding: 1.5em; display: flex; flex-direction: column; gap: 1em; background: transparent; min-height: 280px; margin-bottom: 10px; }
    .msg { max-width: 88%; border-radius: 1em; padding: 0.8em 1em; font-size: 1.08em; line-height: 1.5; word-break: break-word; box-shadow: 0 0 8px rgba(0,255,255,0.3);}
    .msg.user { align-self: flex-end; background: linear-gradient(120deg, #00e5ff 0%, #006eff 100%); color: #fff; text-shadow: 0 0 3px #fff; }
    .msg.bot { align-self: flex-start; background: rgba(0, 255, 255, 0.12); color: #0ff; border: 1px solid #0ff; }
    .pulse { animation: pulseGlow 2s infinite alternate; }
    @keyframes pulseGlow { 0% { box-shadow: 0 0 10px #0ff; } 100% { box-shadow: 0 0 20px #0ff, 0 0 40px #0ff; } }
    #perfChart { border: 2px solid #0ff; box-shadow: 0 0 18px #0ff; border-radius: 12px; background: rgba(0,0,0,0.32); margin-bottom: 18px; margin-top: 12px; width: 100%; max-width: 510px; min-height: 260px; display: block; }
    .input-group { display: flex; background: rgba(0, 0, 0, 0.6); border-radius: 1em; padding: 1em; gap: 0.8em; box-shadow: 0 0 10px #0ff; margin-bottom: 0.8em; }
    .input-group input { flex: 1; border-radius: 12px; border: 1px solid #00ffee; padding: 0.75em 1.15em; background: #000; color: #0ff; font-size: 1.08em; outline: none; }
    .input-group input::placeholder { color: #0cc; opacity: 1; }
    .btns { display: flex; gap: 0.8em; justify-content: center; padding: 1em 0; }
    .btns button { background: transparent; border: 1px solid #0ff; color: #0ff; padding: 0.68em 1.1em; border-radius: 1em; font-weight: 600; font-size: 1em; box-shadow: 0 0 10px #0ff; cursor: pointer; transition: all 0.2s; }
    .btns button:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
    .disclaimer { font-size: 0.96em; background: rgba(0, 255, 255, 0.1); color: #ffe286; border: 1px solid #0ff; border-radius: 10px; margin: 1em; padding: 1em; box-shadow: 0 0 10px #0ff; }
    #footer { text-align: center; color: #0ff; font-size: 0.95em; margin: 1em 0; text-shadow: 0 0 8px #0ff; }
    .rgb-control-group {
      display: flex; gap: 1.3em; align-items: center; margin-bottom: 1.1em;
      background: rgba(0,0,0,0.3); border-radius: 10px; padding: 0.7em 1em;
      box-shadow: 0 0 10px #0ff3; color: #0ff; font-family: inherit;
      justify-content: center;
    }
    .rgb-control-group label { display: flex; align-items: center; gap: 0.5em; font-size: 1.01em; }
    .rgb-control-group select, .rgb-control-group input[type="color"] {
      padding: 0.2em 0.5em; border-radius: 8px; border: none; background: #23282e; color: #0ff; font-family: inherit; font-size: 1em;
    }
    .rgb-strip {
      width: 100%; height: 7px; border-radius: 7px 7px 14px 14px; margin-bottom: 16px;
      background: var(--rgb-gradient, linear-gradient(270deg,#00fff7,#00ff99,#ffeb3b,#ff00ea,#005eff,#00fff7));
      background-size: 1200% 1200%;
      animation: var(--rgb-animation, rgb-border 8s linear infinite);
      filter: blur(1.5px);
    }
    @keyframes rgb-border { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    @keyframes running-bar { 0% { background-position: 0% 0%; } 100% { background-position: 100% 0%; } }
    .vanta-control-group {
      display: flex; gap: 1.1em; align-items: center; justify-content: center;
      margin-bottom: 1em; background: rgba(0,0,0,0.27); border-radius: 10px;
      padding: 0.7em 1em; box-shadow: 0 0 10px #0ff3; color: #0ff;
    }
    .vanta-control-group label { display: flex; align-items: center; gap: 0.5em; font-size: 1.01em; }
    .vanta-control-group input[type="color"], .vanta-control-group select {
      padding: 0.13em 0.5em; border-radius: 8px; border: none; background: #23282e; color: #0ff; font-family: inherit; font-size: 1em;
    }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>

  <!-- VANTA PARTICLES CONTROLS -->
  <div class="vanta-control-group">
    <label>Particles:
      <select id="vantaType">
        <option value="net">Net</option>
        <option value="dots">Dots</option>
        <option value="waves">Waves</option>
        <option value="fog">Fog</option>
        <option value="halo">Halo</option>
        <option value="cells">Cells</option>
      </select>
    </label>
    <label>Color:
      <input type="color" id="vantaColor" value="#00fff7">
    </label>
  </div>

  <!-- RGB MODE CONTROLS + BAR -->
  <div class="rgb-control-group">
    <label>RGB Mode:
      <select id="rgbMode">
        <option value="wave">Wave</option>
        <option value="running">Running</option>
        <option value="static">Static</option>
      </select>
    </label>
    <label>Pick Color:
      <input type="color" id="rgbColor" value="#00fff7">
    </label>
  </div>
  <div class="rgb-strip"></div>

  <div class="container">
    <h2>GPU Data Chat Bot 💬</h2>
    <canvas id="perfChart"></canvas>
    <div id="chatbox"></div>
    <div class="input-group">
      <input type="text" id="userInput" autocomplete="off" placeholder="Try: 'spec rtx 4090', '4070 super vs 7900 xt', 'price 400 700 used', 'help'">
    </div>
    <div class="btns">
      <button id="filterPrice">💰 Price</button>
      <button id="filterPSU">🔌 PSU</button>
      <button id="filterTDP">🔥 TDP</button>
    </div>
    <div class="input-group" style="margin:10px 0 0 0;">
      <label style="margin-right:10px;">
        <input type="radio" name="condition" value="new" checked> New
      </label>
      <label>
        <input type="radio" name="condition" value="used"> Used
      </label>
    </div>
    <div class="disclaimer">
      ⚠️ <b>Disclaimer:</b> This tool is for quick reference only.<br>
      Do <b>not rely on this data for critical decisions</b>; info may be incomplete or inaccurate.<br>
      <b>Always do more research</b> from trusted sources for the latest and most accurate GPU details.
    </div>
    <div id="footer">
      🏗️ Built by <strong>Holabro</strong> | 🤖 Powered by <strong>ChatGPT</strong>
    </div>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Your GPU DATA -->
  <script src="gpu-data.js"></script>
  <!-- Your chatbot/main.js code -->
  <script src="main.js"></script>

  <!-- VANTA.JS PARTICLES -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.halo.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>
  <script>
    // ==== VANTA PARTICLES CONTROLS ====
    let vantaEffect = null;
    const vantaOptions = {
      net: {
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.0,
        scaleMobile: 1.0,
        color: 0x00fff7,
        backgroundColor: 0x0a0a0a,
        points: 16,
        maxDistance: 20,
        spacing: 18
      },
      dots: {
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        minHeight: 200,
        minWidth: 200,
        scale: 1,
        scaleMobile: 1,
        color: 0x00fff7,
        backgroundColor: 0x0a0a0a
      },
      waves: {
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        minHeight: 200,
        minWidth: 200,
        scale: 1,
        scaleMobile: 1,
        color: 0x00fff7,
        shininess: 36,
        waveHeight: 18,
        waveSpeed: 1.3,
        backgroundColor: 0x0a0a0a
      },
      fog: {
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        highlightColor: 0x00fff7,
        midtoneColor: 0x18a0ff,
        lowlightColor: 0x000021,
        baseColor: 0x0a0a0a,
        blurFactor: 0.6,
        speed: 2.5
      },
      halo: {
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        baseColor: 0x00fff7,
        backgroundColor: 0x0a0a0a,
        amplitudeFactor: 2.4
      },
      cells: {
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        size: 1.2,
        color1: 0x00fff7,
        color2: 0x0a0a0a,
        minHeight: 200,
        minWidth: 200,
        scale: 1,
        scaleMobile: 1
      }
    };
    function setVanta(type, color) {
      if (vantaEffect && vantaEffect.destroy) vantaEffect.destroy();
      let opts = {...vantaOptions[type]};
      if (type === "net" || type === "dots" || type === "waves") {
        opts.color = parseInt(color.replace("#","0x"));
        opts.backgroundColor = 0x0a0a0a;
      }
      if (type === "fog") {
        opts.highlightColor = parseInt(color.replace("#","0x"));
      }
      if (type === "halo") {
        opts.baseColor = parseInt(color.replace("#","0x"));
      }
      if (type === "cells") {
        opts.color1 = parseInt(color.replace("#","0x"));
      }
      vantaEffect = window.VANTA[type.toUpperCase()](opts);
    }
    document.addEventListener("DOMContentLoaded", function() {
      const type = document.getElementById("vantaType").value;
      const color = document.getElementById("vantaColor").value;
      setVanta(type, color);

      document.getElementById("vantaType").addEventListener("change", function() {
        setVanta(this.value, document.getElementById("vantaColor").value);
      });
      document.getElementById("vantaColor").addEventListener("input", function() {
        setVanta(document.getElementById("vantaType").value, this.value);
      });
    });
  </script>
  <!-- === RGB BAR CONTROLS === -->
  <script>
    const rgbMode = document.getElementById('rgbMode');
    const rgbColor = document.getElementById('rgbColor');
    const rgbStrip = document.querySelector('.rgb-strip');
    const container = document.querySelector('.container');

    function updateRGBStyle() {
      let color = rgbColor.value;
      let mode = rgbMode.value;
      if (mode === 'static') {
        container.style.setProperty('--rgb-gradient', color);
        rgbStrip.style.background = color;
        container.style.setProperty('--rgb-animation', 'none');
        rgbStrip.style.animation = 'none';
      } else if (mode === 'running') {
        let gradient = `linear-gradient(90deg, transparent 0%, ${color} 40%, ${color} 60%, transparent 100%)`;
        container.style.setProperty('--rgb-gradient', gradient);
        rgbStrip.style.background = gradient;
        container.style.setProperty('--rgb-animation', 'running-bar 1.6s linear infinite');
        rgbStrip.style.animation = 'running-bar 1.6s linear infinite';
      } else {
        let gradient = `linear-gradient(270deg, ${color}, #ff00ea, #005eff, ${color})`;
        container.style.setProperty('--rgb-gradient', gradient);
        rgbStrip.style.background = gradient;
        container.style.setProperty('--rgb-animation', 'rgb-border 8s linear infinite');
        rgbStrip.style.animation = 'rgb-border 8s linear infinite';
      }
    }
    rgbMode.addEventListener('change', updateRGBStyle);
    rgbColor.addEventListener('input', updateRGBStyle);
    window.addEventListener('DOMContentLoaded', updateRGBStyle);
  </script>
</body>
</html>
